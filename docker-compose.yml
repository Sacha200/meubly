name: meubly

# Base Supabase locale : stack Supabase CLI (`npx supabase@2.122.1 start`), hors compose.
# API http://127.0.0.1:54321 (host.docker.internal:54321 depuis un conteneur).

services:
  meubly-back:
    container_name: back
    build:
      context: ./meubly-back
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      SUPABASE_URL: http://host.docker.internal:54321
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  meubly-front:
    container_name: front
    build:
      context: ./meubly-front
      args:
        VITE_API_BASE_URL: http://localhost:5000/api/v1
        VITE_SUPABASE_URL: http://localhost:54321
        VITE_SUPABASE_ANON_KEY: ${ANON_KEY}
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - meubly-back

  ingestion:
    container_name: ingestion
    profiles:
      # Ne pas démarrer automatiquement avec le front/back.
      # Lance-le explicitement avec: --profile ingestion
      - ingestion
    build:
      context: ./bd/ingestion
    restart: unless-stopped
    volumes:
      # Datasets locaux (CSV/JSON) pour ingestion
      - ./data:/data:ro
    environment:
      # Supabase local (stack CLI)
      SUPABASE_URL: http://host.docker.internal:54321
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      # Batch schedule
      BATCH_CRON: ${BATCH_CRON:-0 3 * * *}
      # Import competitors (CSV déjà en français)
      COMPETITORS_CSV_PATH: /data/competitors_fr.csv
      # IKEA adapter
      IKEA_COUNTRY: ${IKEA_COUNTRY:-fr}
      IKEA_LANGUAGE: ${IKEA_LANGUAGE:-fr}
      IKEA_SEARCH_TERMS: ${IKEA_SEARCH_TERMS:-canapé,bureau,chaise}
      IKEA_SEARCH_LIMIT: ${IKEA_SEARCH_LIMIT:-10}
      IKEA_TOKEN: ${IKEA_TOKEN:-}
      IKEA_DEBUG: ${IKEA_DEBUG:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ===========================================================================
  # SONARQUBE - Analyse qualité de code
  # Démarrage: docker compose --profile sonar up -d
  # Interface: http://localhost:9000  (admin / admin)
  # ===========================================================================
  sonarqube_db:
    container_name: sonarqube-db
    image: postgres:15
    profiles: ["sonar"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SONAR_DB_USER:-sonar}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
      POSTGRES_DB: ${SONAR_DB_NAME:-sonarqube}
    ports:
      - "${SONAR_DB_PORT:-5433}:5432"
    volumes:
      - sonarqube_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONAR_DB_USER:-sonar} -d ${SONAR_DB_NAME:-sonarqube}"]
      interval: 5s
      timeout: 3s
      retries: 10

  sonarqube:
    container_name: sonarqube
    image: sonarqube:community
    profiles: ["sonar"]
    restart: unless-stopped
    depends_on:
      sonarqube_db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube_db:5432/${SONAR_DB_NAME:-sonarqube}
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER:-sonar}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
    ports:
      - "${SONAR_PORT:-9000}:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_pgdata:
