# Sonde jetable (phase 3, tache 0) : les marchands acceptent-ils l'agent declare depuis GitHub Actions ?
# Lecture seule : robots.txt + une page de catalogue par marchand, codes HTTP affiches. Supprimee en tache 13.
name: ingest-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Codes HTTP par marchand
        run: |
          node --input-type=module -e '
          const UA = "PrixoliBot/1.0 (+https://github.com/Sacha200/meubly)";
          const urls = [
            "https://www.connox.fr/robots.txt", "https://www.connox.fr/products.json?limit=1",
            "https://www.fleux.com/robots.txt", "https://www.fleux.com/products.json?limit=1",
            "https://thecoolrepublic.com/robots.txt", "https://thecoolrepublic.com/products.json?limit=1",
            "https://www.nordicnest.fr/robots.txt", "https://www.nordicnest.fr/api/sitemap/fr-fr/sitemapindex.xml",
          ];
          for (const u of urls) {
            await new Promise((r) => setTimeout(r, 2000));
            try {
              const r = await fetch(u, { headers: { "User-Agent": UA } });
              console.log(r.status, r.headers.get("cf-mitigated") ? "(challenge)" : "", u);
            } catch (e) { console.log("ERR", e.cause?.code || e.message, u); }
          }'
